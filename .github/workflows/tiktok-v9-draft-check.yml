name: TikTok v9 Draft Python Check
on:
  push:
    branches:
      - 'chatgpt/tiktok-v9-report-write-failures-20261117'
  pull_request:
    paths:
      - 'TikTok_DailyPipeline_v9.py'
      - '.github/workflows/tiktok-v9-draft-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile Python without executing the pipeline
        run: python3 -m py_compile TikTok_DailyPipeline_v9.py
      - name: Verify required failure reporting branches exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          p = Path("TikTok_DailyPipeline_v9.py")
          s = p.read_text(encoding="utf-8")
          ast.parse(s)
          assert 'write_errors.append(("DB_WRITE_ERROR", vid))' in s
          assert 'write_errors.append(("STATE_WRITE_ERROR", vid))' in s
          assert 'if write_errors or failed_accounts or recovery_attention or unseen_retries:' in s
          assert 'if scanned_accounts == 0:' in s
          assert 'sys.exit("ERROR: no active TikTok accounts available for monitoring")' in s
          print("Static failure-reporting checks PASS")
          PY

      - name: Read-only live Supabase Data API smoke test
        run: |
          python3 - <<'PY'
          # GET only. Never load a secret, create a media row or write State.
          import ast
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          p = ast.parse(Path("TikTok_DailyPipeline_v9.py").read_text(encoding="utf-8"))
          named = {}
          for node in p.body:
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id in ("KEY", "URL"):
                          named[t.id] = ast.literal_eval(node.value)
          assert named["KEY"].startswith("sb_publishable_")
          assert named["URL"] == "https://anijyugrqffxlnlijtnb.supabase.co"
          func = next(n for n in p.body if isinstance(n, ast.FunctionDef) and n.name == "api_get")
          code = compile(ast.fix_missing_locations(ast.Module(body=[func],type_ignores=[])),
                         "<v9_public_get>", "exec")
          ns = {**named, "json": json, "Request": Request, "urlopen": urlopen,
                "quote": quote}
          exec(code, ns)
          songs = ns["api_get"]("songs", "song_id,song_title", "song_id=eq.S0037")
          assert len(songs) == 1 and songs[0]["song_id"] == "S0037"
          media = ns["api_get"]("media_items", "media_id,platform_item_id",
                                "platform=eq.tiktok&platform_item_id=eq.7704583712473746709")
          assert len(media) == 1
          # TikTok exceeds 1000 rows. Exercise limit=1000 + offset paging
          # exactly as the PC94 script uses it, without writing anything.
          all_tiktok = ns["api_get"]("media_items", "media_id", "platform=eq.tiktok")
          ids = [r["media_id"] for r in all_tiktok]
          assert len(ids) > 1000 and len(ids) == len(set(ids))
          print("Read-only Supabase REST GET PASS; pagination rows:", len(ids))
          PY

      - name: Simulate actual final-write control flow without network
        run: |
          python3 - <<'PY'
          import ast
          import csv
          import io
          import sys
          from pathlib import Path

          source = Path("TikTok_DailyPipeline_v9.py").read_text(encoding="utf-8")
          parsed = ast.parse(source)
          i = next(
              n for n, node in enumerate(parsed.body)
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "registered" for t in node.targets)
          )
          end_code = compile(
              ast.fix_missing_locations(ast.Module(body=parsed.body[i:], type_ignores=[])),
              "<v9_final_write_path>", "exec",
          )

          header = "video_id,decision,match_type,match_title\n"
          class FakeOutput:
              def __init__(self, text):
                  self.text = text
              def open(self, *args, **kwargs):
                  return io.StringIO(self.text)

          def simulate(rows, db_failure=False, state_failure=False, scan_failures=None):
              flags = {"register_calls": 0, "state_calls": 0}
              def register(row):
                  flags["register_calls"] += 1
                  if db_failure:
                      raise RuntimeError("mock database write failed")
                  return 123
              def save_state(row):
                  flags["state_calls"] += 1
                  if state_failure:
                      raise RuntimeError("mock state write failed")
              ns = {
                  "OUT": FakeOutput(header + rows),
                  "csv": csv,
                  "sys": sys,
                  "counts": {},
                  "STATE_TABLE": "tiktok_daily_pipeline_state",
                  "state_known": set(),
                  "retryable_auto": set(),
                  "new": {},
                  "failed_accounts": list(scan_failures or []),
                  "register_auto_ready": register,
                  "state_upsert": save_state,
                  "print": lambda *args, **kwargs: None,
              }
              try:
                  exec(end_code, ns)
                  return False, flags
              except SystemExit as e:
                  return bool(e.code), flags

          normal, stat = simulate("")
          assert normal is False and stat["state_calls"] == 0
          original = "7423254885400939784,AUTO_READY_ORIGINAL,ORIGINAL,u...\n"
          normal, stat = simulate(original)
          assert normal is False and stat["register_calls"] == 1 and stat["state_calls"] == 1
          abnormal, stat = simulate(original, db_failure=True)
          assert abnormal is True and stat["register_calls"] == 1 and stat["state_calls"] == 0
          nonauto = "7703741502568140084,HOLD,,\n"
          abnormal, stat = simulate(nonauto, state_failure=True)
          assert abnormal is True and stat["state_calls"] == 1
          abnormal, stat = simulate("", scan_failures=["some_account"])
          assert abnormal is True

          scan_guard = next(node for node in parsed.body if isinstance(node, ast.If)
                            and ast.unparse(node.test) == "scanned_accounts == 0")
          guard_code = compile(ast.fix_missing_locations(
              ast.Module(body=[scan_guard], type_ignores=[])), "<all_account_scan_guard>", "exec")
          try:
              exec(guard_code, {"scanned_accounts": 0, "sys": sys})
              raise AssertionError("All failed accounts should terminate")
          except SystemExit as e:
              assert e.code
          exec(guard_code, {"scanned_accounts": 1, "sys": sys})
          # Exercise the actual pending-recovery selection from v9 AST.
          func = next(node for node in parsed.body if isinstance(node, ast.FunctionDef)
                      and node.name == "pending_auto_state_retries")
          unit = compile(ast.fix_missing_locations(
              ast.Module(body=[func], type_ignores=[])), "<recovery_selection>", "exec")
          recovery = {}
          exec(unit, recovery)
          detect = recovery["pending_auto_state_retries"]
          media = [
              {"media_id": 101, "platform_item_id": "701", "notes": "auto_tiktok_daily_v9"},
              {"media_id": 102, "platform_item_id": "702", "notes": "manual"},
              {"media_id": 103, "platform_item_id": "703", "notes": ""},
              {"media_id": 104, "platform_item_id": "704", "notes": "auto_tiktok_daily_v9"},
          ]
          originals = [{"media_id": 103, "match_method": "auto_tiktok_account_title"}]
          # A legacy link must not be reprocessed solely for sharing the
          # historical auto method name with v9.
          assert originals[0]["match_method"] == "auto_tiktok_account_title"
          assert detect(media, {"704"}) == {"701"}
          assert detect(media, {"701", "704"}) == set()
          media.append({"media_id": 105, "platform_item_id": "705",
                        "notes": "auto_tiktok_daily_strict_20261101"})
          assert detect(media, {"704"}) == {"701"}

          # A failed persisted auto registration that does not reappear in account
          # discovery must make the job fail, never silently report success.
          ns = {
              "registered": [], "state_written": 0, "write_errors": [],
              "recovery_attention": [], "retryable_auto": {"701"},
              "new": {}, "OUT": FakeOutput(header), "csv": csv,
              "STATE_TABLE": "tiktok_daily_pipeline_state",
              "state_known": set(), "counts": {}, "failed_accounts": [],
              "print": lambda *args, **kwargs: None, "sys": sys,
          }
          try:
              exec(end_code, ns)
              raise AssertionError("Missing rediscovery must fail")
          except SystemExit as exc:
              assert exc.code
          # Exercise the actual register_auto_ready() code with fake API calls.
          registration = next(node for node in parsed.body if isinstance(node, ast.FunctionDef)
                              and node.name == "register_auto_ready")
          regcode = compile(ast.fix_missing_locations(
              ast.Module(body=[registration], type_ignores=[])), "<register_auto_ready>", "exec")
          def registration_case(original=None, cover=None, existing=True, link_status="matched"):
              events = []
              def fake_get(table, select, filters=""):
                  if table == "media_items":
                      return [{"media_id": 501}] if existing else []
                  if table == "song_media_links" and select == "song_id,match_status":
                      return [{"song_id": x, "match_status": link_status} for x in (original or [])]
                  if table == "cover_song_media_links" and select == "cover_song_id,match_status":
                      return [{"cover_song_id": x, "match_status": link_status} for x in (cover or [])]
                  if table == "song_media_links" and select == "song_id,media_id":
                      return [{"song_id": x, "media_id": 501} for x in (original or []) if x == "S0001"]
                  return []
              def fake_post(table, payload):
                  events.append((table, payload))
                  return [{"media_id": 501}]
              scope = {"api_secret_get": fake_get, "api_post": fake_post,
                       "quote": lambda x: x, "int": int, "float": float, "str": str}
              exec(regcode, scope)
              row = {"video_id": "7701", "match_type": "ORIGINAL", "match_id": "S0001",
                     "title": "test", "url": "https://www.tiktok.com/@test/video/7701"}
              try:
                  result = scope["register_auto_ready"](row)
                  return result, events
              except RuntimeError:
                  return None, events

          result, events = registration_case(original=["S0001"])
          assert result == 501 and len(events) == 0
          result, events = registration_case(original=["S0002"])
          assert result is None and len(events) == 0
          result, events = registration_case(cover=["C0001"])
          assert result is None and len(events) == 0
          result, events = registration_case(original=["S0001"], link_status="exclude")
          assert result is None and len(events) == 0
          result, events = registration_case(original=["S0001"], link_status="unmatched")
          assert result is None and len(events) == 0
          result, events = registration_case(original=["S0001"], link_status="confirmed")
          assert result == 501 and len(events) == 0
          result, events = registration_case()
          assert result == 501 and [e[0] for e in events] == ["song_media_links"]
          print("Registered media reuse / link collision fail-closed checks PASS")
          print("Recovery selection and missing-rediscovery failure checks PASS")
          print("Five isolated normal/error cases and zero-account guard PASS")
          PY
